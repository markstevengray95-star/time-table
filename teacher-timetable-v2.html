<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>Teacher Timetable Manager</title>
<style>:root{--bg:#0b1220;--p:#111b2e;--p2:#17233a;--l:#263550;--t:#e8eef8;--m:#93a4bd;--b:#7c8cff;--g:#5fdb9b;--r:#ff7a90}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 10% 0,#15284b 0,transparent 28%),var(--bg);color:var(--t)}button,input,select,textarea{font:inherit}.app{max-width:1500px;margin:auto;padding:20px}.top,.actions,.bar,.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{justify-content:space-between;align-items:flex-start}.sub,.muted,small{color:var(--m)}.btn{border:1px solid var(--l);background:var(--p2);color:var(--t);padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}.primary{background:var(--b);border-color:transparent}.good{color:#baf3d2;border-color:#397c5a;background:#16362c}.danger{color:#ffc0cb;border-color:#703744;background:#321921}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:15px;margin:14px 0;box-shadow:0 15px 45px #0004}.pill{border:1px solid var(--l);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--m)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:var(--p);border:1px solid var(--l);border-radius:13px;padding:13px}.stat strong{display:block;font-size:24px;margin-top:5px}.dash{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}.agenda{display:grid;gap:7px}.item{background:#0f192b;border:1px solid var(--l);border-radius:10px;padding:10px}.item.now{border-color:#397c5a}.item.next{border-color:#5265d8}.free{display:flex;gap:6px;flex-wrap:wrap}.wrap{overflow:auto;border:1px solid var(--l);border-radius:13px}.week{min-width:920px;display:grid;grid-template-columns:100px repeat(5,minmax(150px,1fr));gap:1px;background:var(--l)}.week>div{background:var(--p);min-height:70px;padding:8px}.head{background:#15223a!important;text-align:center;min-height:auto!important;font-weight:800;font-size:12px}.time{background:#0f192b!important;color:var(--m);font-size:11px;font-weight:800}.lesson{border:1px solid #5867b755;border-left:4px solid var(--b);background:#5867b722;border-radius:8px;padding:7px;margin-bottom:5px;cursor:pointer}.lesson.now{border-left-color:var(--g);background:#2e8b5722}.lesson b{display:block;font-size:12px}.lesson span{font-size:10px;color:var(--m)}.activity{border-left-color:#54d2c7}.empty{text-align:center;color:#61718a;padding-top:12px;font-size:11px}.list{display:grid;gap:7px}.row{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;background:#0f192b;border:1px solid var(--l);border-radius:10px;padding:10px}.search{flex:1;min-width:220px}input,select,textarea{background:#0c1627;color:var(--t);border:1px solid #30425f;border-radius:8px;padding:8px;width:100%}.modalbg{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:15px;z-index:10}.modalbg.open{display:grid}.modal{width:min(620px,100%);background:#111c2f;border:1px solid #30425f;border-radius:15px;padding:17px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:11px;color:var(--m);font-weight:700;margin:8px 0 4px}textarea{min-height:75px}.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}.notice{padding:10px;border:1px solid #397c5a;background:#16362c;border-radius:10px;color:#baf3d2;font-size:12px}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.dash,.g2{grid-template-columns:1fr}.row{grid-template-columns:80px 1fr}.row .btn{grid-column:1/-1}}@media print{.actions,.bar .btn,.filters,.dash,.row .btn{display:none!important}body{background:#fff;color:#000}.card{border:0;box-shadow:none}.week>div{background:#fff;color:#000}.lesson{background:#f5f5f5;color:#000}.lesson span{color:#444}}</style></head>
<body><div class="app"><div class="top"><div><h1 style="margin:0">Teacher Timetable</h1><div class="sub">Adcote School · two-week cycle</div></div><div class="actions"><button class="btn primary" onclick="newLesson()">+ Add lesson</button><button class="btn" onclick="downloadICS()">Export 12 weeks (.ics)</button><button class="btn" onclick="window.print()">Print</button><button class="btn" onclick="backup()">Backup</button><button class="btn good" onclick="resetOriginal()">Reload original</button></div></div><div class="card notice">Further Maths has been removed. Your timetable now contains 46 teaching lessons.</div><div class="card bar"><b>Timetable:</b><button id="w1" class="btn" onclick="setWeek('W1')">Week 1</button><button id="w2" class="btn" onclick="setWeek('W2')">Week 2</button><button class="btn good" onclick="useCurrent()">Use current week</button><span id="wk" class="pill"></span><span id="range" class="pill"></span></div><div class="stats"><div class="stat"><small>Lessons</small><strong id="sLessons">0</strong></div><div class="stat"><small>Teaching time</small><strong id="sHours">0h</strong></div><div class="stat"><small>Free periods</small><strong id="sFree">0</strong></div><div class="stat"><small>Classes</small><strong id="sClasses">0</strong></div></div><div class="dash"><div class="card"><h3>Today & next lesson</h3><div id="agenda" class="agenda"></div></div><div class="card"><h3>Free periods this week</h3><div id="free" class="free"></div></div></div><div class="card"><div class="wrap"><div id="grid" class="week"></div></div></div><div class="card"><div class="filters"><h3 style="margin:0;margin-right:auto">All lessons</h3><input id="q" class="search" placeholder="Search subject, class or room" oninput="renderList()"><select id="df" style="width:auto" onchange="renderList()"><option value="">All days</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select></div><div id="list" class="list" style="margin-top:12px"></div></div></div>
<div id="modal" class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3 id="mt">Lesson</h3><input id="eid" type="hidden"><div class="g2"><div><label>Week</label><select id="fw"><option value="W1">Week 1</option><option value="W2">Week 2</option></select></div><div><label>Day</label><select id="fd"><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option></select></div></div><div class="g2"><div><label>Start</label><input id="fs" type="time"></div><div><label>End</label><input id="fe" type="time"></div></div><label>Subject</label><input id="fsub"><div class="g2"><div><label>Class/group</label><input id="fc"></div><div><label>Room</label><input id="fr"></div></div><label>Lesson notes / reminder</label><textarea id="fn"></textarea><div class="ma"><button id="del" class="btn danger" onclick="deleteLesson()" style="margin-right:auto">Delete</button><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveLesson()">Save</button></div></div></div>
<script>const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday'],KEY='teacherTimetableV2',ANCHOR='2026-09-14';let ORIGINAL=null,state=null,currentWeek='W1';const clone=x=>JSON.parse(JSON.stringify(x)),mins=t=>{const m=String(t).match(/(\d+):(\d+)/);return m?(+m[1]*60+ +m[2]):0},esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function sow(d=new Date()){const x=new Date(d),n=(x.getDay()+6)%7;x.setHours(0,0,0,0);x.setDate(x.getDate()-n);return x}function autoWeek(d=new Date()){const a=new Date(ANCHOR+'T00:00:00'),n=Math.round((sow(d)-a)/604800000);return Math.abs(n)%2===0?'W1':'W2'}function selectedStart(){const n=sow(),a=autoWeek(n);if(a===currentWeek)return n;const x=new Date(n);x.setDate(x.getDate()+7);return x}function fmt(d){return d.toLocaleDateString(undefined,{day:'numeric',month:'short'})}async function boot(){try{const txt=await fetch('standalone.html?source=2').then(r=>r.text()),m=txt.match(/const ORIGINAL=(\{[\s\S]*?\});\s*const DAYS=/);if(!m)throw Error('data');ORIGINAL=JSON.parse(m[1]);ORIGINAL.lessons=ORIGINAL.lessons.filter(x=>String(x.subject).toLowerCase()!=='further maths');const saved=JSON.parse(localStorage.getItem(KEY)||'null');state=saved&&Array.isArray(saved.lessons)?saved:clone(ORIGINAL);state.lessons=state.lessons.filter(x=>String(x.subject).toLowerCase()!=='further maths');currentWeek=autoWeek();render()}catch(e){document.querySelector('.app').innerHTML='<div class="card"><h2>Could not load timetable data</h2><p>Open the repository version of standalone.html once, then refresh this page.</p></div>'}}function persist(){localStorage.setItem(KEY,JSON.stringify(state));render()}function setWeek(w){currentWeek=w;render()}function useCurrent(){currentWeek=autoWeek();render()}function render(){const arr=state.lessons.filter(x=>x.week===currentWeek);w1.classList.toggle('primary',currentWeek==='W1');w2.classList.toggle('primary',currentWeek==='W2');wk.textContent=currentWeek==='W1'?'Week 1':'Week 2';const a=selectedStart(),b=new Date(a);b.setDate(b.getDate()+4);range.textContent=fmt(a)+'–'+fmt(b);sLessons.textContent=arr.length;sHours.textContent=(arr.reduce((n,x)=>n+mins(x.end)-mins(x.start),0)/60).toFixed(0)+'h';sFree.textContent=30-arr.length;sClasses.textContent=new Set(arr.map(x=>x.className).filter(Boolean)).size;renderAgenda(arr);renderFree(arr);renderGrid(arr);renderList()}function renderAgenda(arr){const n=new Date(),day=DAYS[n.getDay()-1],nm=n.getHours()*60+n.getMinutes();if(!day){agenda.innerHTML='<div class="item"><b>Weekend</b><div class="muted">No teaching timetable today.</div></div>';return}const xs=arr.filter(x=>x.day===day).sort((a,b)=>mins(a.start)-mins(b.start));let tagged=false;agenda.innerHTML=xs.length?xs.map(x=>{const now=nm>=mins(x.start)&&nm<mins(x.end),next=!now&&!tagged&&mins(x.start)>nm;if(now||next)tagged=true;return '<div class="item '+(now?'now':next?'next':'')+'"><b>'+(now?'Now · ':next?'Next · ':'')+esc(x.subject)+'</b><div>'+x.start+'–'+x.end+' · '+esc(x.className)+'</div><small>'+esc(x.room)+(x.notes?' · '+esc(x.notes):'')+'</small></div>'}).join(''):'<div class="item">No lessons today.</div>'}function renderFree(arr){const xs=[];DAYS.forEach(d=>state.periods.forEach((p,i)=>{if(!arr.some(x=>x.day===d&&x.start===p[0]))xs.push(d.slice(0,3)+' P'+(i+1))}));free.innerHTML=xs.map(x=>'<span class="pill">'+x+'</span>').join('')}function renderGrid(arr){let h='<div class="head">Time</div>'+DAYS.map(d=>'<div class="head">'+d+'</div>').join(''),n=new Date(),td=DAYS[n.getDay()-1],nm=n.getHours()*60+n.getMinutes();for(const p of state.periods){h+='<div class="time">'+p[0]+'<br><span>'+p[1]+'</span></div>';for(const d of DAYS){const xs=arr.filter(x=>x.day===d&&x.start===p[0]);h+='<div>'+(xs.length?xs.map(x=>{const now=autoWeek(n)===currentWeek&&d===td&&nm>=mins(x.start)&&nm<mins(x.end);return '<div class="lesson '+(now?'now':'')+'" onclick="editLesson(\''+x.id+'\')"><b>'+esc(x.subject)+'</b><span>'+esc(x.className)+' · '+esc(x.room)+'</span></div>'}).join(''):'<div class="empty">Free</div>')+'</div>'}}h+='<div class="time">16:30<br><span>17:30</span></div>';for(const d of DAYS){const xs=(state.activities||[]).filter(x=>x.week===currentWeek&&x.day===d);h+='<div>'+(xs.length?xs.map(x=>'<div class="lesson activity"><b>'+esc(x.subject)+'</b><span>'+esc(x.className)+' · '+esc(x.room)+'</span></div>').join(''):'<div class="empty">—</div>')+'</div>'}grid.innerHTML=h}function renderList(){if(!state)return;const s=(q.value||'').toLowerCase(),d=df.value,xs=state.lessons.filter(x=>x.week===currentWeek).filter(x=>(!d||x.day===d)&&(!s||[x.subject,x.className,x.room,x.notes].join(' ').toLowerCase().includes(s))).sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day)||mins(a.start)-mins(b.start));list.innerHTML=xs.length?xs.map(x=>'<div class="row"><div><b>'+x.day.slice(0,3)+'</b><br><small>'+x.start+'–'+x.end+'</small></div><div><b>'+esc(x.subject)+'</b><br><small>'+esc(x.className)+' · '+esc(x.room)+(x.notes?' · '+esc(x.notes):'')+'</small></div><button class="btn" onclick="editLesson(\''+x.id+'\')">Edit</button></div>').join(''):'<div class="muted">No matching lessons.</div>'}function newLesson(){eid.value='';mt.textContent='Add lesson';fw.value=currentWeek;fd.value='Monday';fs.value=state.periods[0][0];fe.value=state.periods[0][1];fsub.value='';fc.value='';fr.value='';fn.value='';del.style.display='none';modal.classList.add('open')}function editLesson(id){const x=state.lessons.find(y=>y.id===id);if(!x)return;eid.value=x.id;mt.textContent='Edit lesson';fw.value=x.week;fd.value=x.day;fs.value=x.start;fe.value=x.end;fsub.value=x.subject;fc.value=x.className;fr.value=x.room;fn.value=x.notes||'';del.style.display='inline-block';modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function saveLesson(){if(!fsub.value.trim())return alert('Add a subject.');const x={id:eid.value||'custom-'+Date.now(),week:fw.value,day:fd.value,start:fs.value,end:fe.value,subject:fsub.value.trim(),className:fc.value.trim(),room:fr.value.trim(),notes:fn.value.trim()},i=state.lessons.findIndex(y=>y.id===eid.value);if(i>=0)state.lessons[i]=x;else state.lessons.push(x);currentWeek=x.week;persist();closeModal()}function deleteLesson(){if(!eid.value||!confirm('Delete this lesson?'))return;state.lessons=state.lessons.filter(x=>x.id!==eid.value);persist();closeModal()}function resetOriginal(){if(confirm('Reload the original timetable with Further Maths removed?')){state=clone(ORIGINAL);localStorage.setItem(KEY,JSON.stringify(state));useCurrent()}}function backup(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='teacher-timetable-backup.json';a.click()}function stamp(d){return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z')}function eventDate(base,w,day,time){const d=new Date(base);d.setDate(d.getDate()+w*7+DAYS.indexOf(day));const z=time.split(':');d.setHours(+z[0],+z[1],0,0);return d}function downloadICS(){const base=sow(),out=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Teacher Timetable//EN'];for(let w=0;w<12;w++){const cyc=autoWeek(new Date(base.getTime()+w*604800000));state.lessons.filter(x=>x.week===cyc).forEach(x=>{const s=eventDate(base,w,x.day,x.start),e=eventDate(base,w,x.day,x.end);out.push('BEGIN:VEVENT','UID:'+x.id+'-'+s.toISOString().slice(0,10)+'@timetable','DTSTAMP:'+stamp(new Date()),'DTSTART:'+stamp(s),'DTEND:'+stamp(e),'SUMMARY:'+x.subject+' - '+x.className,'LOCATION:'+(x.room||''),'DESCRIPTION:'+(x.notes||'').replace(/\n/g,'\\n'),'END:VEVENT')})}out.push('END:VCALENDAR');const b=new Blob([out.join('\r\n')],{type:'text/calendar'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='teacher-timetable-next-12-weeks.ics';a.click()}boot();</script></body></html>
